<script>
// --- localStorage shim for window.storage (works standalone, no Claude runtime needed) ---
if (!window.storage) {
  window.storage = {
    async get(key) {
      const v = localStorage.getItem('bitacora:' + key);
      return v === null ? null : { key, value: v, shared: false };
    },
    async set(key, value) {
      localStorage.setItem('bitacora:' + key, value);
      return { key, value, shared: false };
    },
    async delete(key) {
      localStorage.removeItem('bitacora:' + key);
      return { key, deleted: true, shared: false };
    },
    async list(prefix) {
      const keys = Object.keys(localStorage)
        .filter(k => k.startsWith('bitacora:' + (prefix || '')))
        .map(k => k.slice('bitacora:'.length));
      return { keys, shared: false };
    },
  };
}

const todayISO = () => new Date().toISOString().slice(0,10);

document.getElementById('todayLabel').textContent = new Date().toLocaleDateString('es-MX', {year:'numeric', month:'long', day:'numeric'});

// ============ RUTINA (Ketogains 5x5) ============

const REST_SECONDS = 15;
const DEFAULT_WEIGHT = 20;
const WARMUP_ROUNDS = 5;
const WARMUP_STEPS = [
  { id: 'trote', label: 'Trotar en el sitio', detail: '30 segundos' },
  { id: 'swings', label: 'KB Swings', detail: '20 reps' },
  { id: 'jump_rope', label: 'Saltos de cuerda', detail: '10 reps' },
];
const RUTINA_PLAN = {
  A: [
    { id: 'squat', name: 'Sentadilla', sets: 5, reps: 5, tier: 'main' },
    { id: 'bench', name: 'Press de banca', sets: 5, reps: 5, tier: 'main' },
    { id: 'row', name: 'Remo con barra', sets: 5, reps: 5, tier: 'main' },
    { id: 'shrug', name: 'Encogimientos (shrugs)', sets: 3, reps: 8, tier: 'acc' },
    { id: 'tricep_ext', name: 'Extensión de tríceps', sets: 3, reps: 8, tier: 'acc' },
    { id: 'curl', name: 'Curl de bíceps', sets: 3, reps: 8, tier: 'acc' },
  ],
  B: [
    { id: 'squat', name: 'Sentadilla', sets: 5, reps: 5, tier: 'main' },
    { id: 'deadlift', name: 'Peso muerto', sets: 1, reps: 5, tier: 'main' },
    { id: 'press', name: 'Press militar', sets: 5, reps: 5, tier: 'main' },
    { id: 'row', name: 'Remo con barra', sets: 5, reps: 5, tier: 'main' },
    { id: 'close_bench', name: 'Press cerrado', sets: 3, reps: 8, tier: 'acc' },
    { id: 'curl', name: 'Curl de bíceps', sets: 3, reps: 8, tier: 'acc' },
  ],
};
const RUTINA_STORAGE_KEY = 'ketogains-5x5-state-html';

function rutinaDefaultState() {
  return { sessionIndex: 0, weights: {}, history: [], completed: {}, dayOverride: null, warmupDone: {}, currentSessionDate: new Date().toISOString() };
}
function toInputValue(iso) {
  const d = new Date(iso);
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fromInputValue(val) {
  const d = new Date(val);
  return isNaN(d.getTime()) ? new Date().toISOString() : d.toISOString();
}
function formatDateShort(iso) {
  return new Date(iso).toLocaleString('es-MX', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}

let rState = rutinaDefaultState();
let rRestTimer = null;
let rWarmupRestTimer = null;
let rEditingHistIndex = null;

function rLoadState() {
  try {
    const raw = localStorage.getItem(RUTINA_STORAGE_KEY);
    if (raw) rState = { ...rutinaDefaultState(), ...JSON.parse(raw) };
  } catch (e) {}
}
function rSaveState() {
  try { localStorage.setItem(RUTINA_STORAGE_KEY, JSON.stringify(rState)); } catch (e) {}
}
function rGetDay() { return rState.dayOverride || (rState.sessionIndex % 2 === 0 ? 'A' : 'B'); }
function rSetDay(letter) {
  if (rGetDay() === letter) return;
  rState.dayOverride = letter;
  rState.completed = {};
  rState.warmupDone = {};
  rStopRest(); rStopWarmupRest();
  rSaveState(); rRender();
}
function rGetExercises() { return RUTINA_PLAN[rGetDay()]; }
function rGetWeight(ex) { return rState.weights[ex.id] ?? DEFAULT_WEIGHT; }
function rSetWeight(ex, val) {
  rState.weights[ex.id] = Math.max(0, Math.round(val * 100) / 100);
  rSaveState(); rRenderExercises();
}
function rGetCompleted(ex) { return rState.completed[ex.id] ?? 0; }
function rTapPlate(ex, idx) {
  const cur = rGetCompleted(ex);
  const marking = idx + 1 !== cur;
  rState.completed[ex.id] = marking ? idx + 1 : idx;
  rSaveState();
  if (marking) { rStartRest(ex.id); } else if (rRestTimer && rRestTimer.exId === ex.id) { rStopRest(); }
  rRenderExercises();
}
function rStartRest(exId) {
  rStopRest();
  rRestTimer = { exId, secondsLeft: REST_SECONDS };
  rRestTimer.intervalId = setInterval(() => {
    rRestTimer.secondsLeft -= 1;
    if (rRestTimer.secondsLeft <= 0) rStopRest();
    rRenderRestUI();
  }, 1000);
  rRenderRestUI();
}
function rStopRest() {
  if (rRestTimer) { clearInterval(rRestTimer.intervalId); rRestTimer = null; }
  rRenderRestUI();
}
function rWarmupKey(round, stepId) { return round + '-' + stepId; }
function rIsWarmupDone(round, stepId) { return !!rState.warmupDone[rWarmupKey(round, stepId)]; }
function rIsWarmupRoundDone(round) { return WARMUP_STEPS.every((s) => rIsWarmupDone(round, s.id)); }
function rToggleWarmup(round, stepId) {
  const wasRoundDone = rIsWarmupRoundDone(round);
  const key = rWarmupKey(round, stepId);
  rState.warmupDone[key] = !rState.warmupDone[key];
  rSaveState();
  const nowRoundDone = rIsWarmupRoundDone(round);
  if (!wasRoundDone && nowRoundDone && round < WARMUP_ROUNDS) { rStartWarmupRest(round); }
  else if (rWarmupRestTimer && rWarmupRestTimer.round === round && !nowRoundDone) { rStopWarmupRest(); }
  rRenderWarmup();
}
function rStartWarmupRest(round) {
  rStopWarmupRest();
  rWarmupRestTimer = { round, secondsLeft: REST_SECONDS };
  rWarmupRestTimer.intervalId = setInterval(() => {
    rWarmupRestTimer.secondsLeft -= 1;
    if (rWarmupRestTimer.secondsLeft <= 0) rStopWarmupRest();
    rRenderWarmupRestUI();
  }, 1000);
  rRenderWarmupRestUI();
}
function rStopWarmupRest() {
  if (rWarmupRestTimer) { clearInterval(rWarmupRestTimer.intervalId); rWarmupRestTimer = null; }
  rRenderWarmupRestUI();
}
function rAllDone() { return rGetExercises().every((ex) => rGetCompleted(ex) === ex.sets); }
function rAnyProgress() { return rGetExercises().some((ex) => rGetCompleted(ex) > 0); }

function rFinishSession() {
  if (!rAnyProgress()) return;
  const exercises = rGetExercises();
  const entry = {
    date: rState.currentSessionDate,
    day: rGetDay(),
    exercises: exercises.map((ex) => ({ id: ex.id, name: ex.name, weight: rGetWeight(ex), setsDone: rGetCompleted(ex), setsTarget: ex.sets })),
  };
  const newWeights = { ...rState.weights };
  exercises.forEach((ex) => {
    if (rGetCompleted(ex) === ex.sets) {
      const bump = ex.tier === 'main' ? 2.5 : 1.25;
      newWeights[ex.id] = Math.round((rGetWeight(ex) + bump) * 100) / 100;
    }
  });
  rState = {
    sessionIndex: rState.sessionIndex + 1, weights: newWeights,
    history: [entry, ...rState.history].slice(0, 60),
    completed: {}, dayOverride: null, warmupDone: {}, currentSessionDate: new Date().toISOString(),
  };
  rStopRest(); rStopWarmupRest(); rSaveState(); rRender();
}

function rRenderWarmup() {
  const card = document.getElementById('warmupCard');
  card.innerHTML = '';
  for (let r = 1; r <= WARMUP_ROUNDS; r++) {
    const wrap = document.createElement('div');
    wrap.className = 'warmup-round-wrap';
    const row = document.createElement('div');
    row.className = 'warmup-round';
    const label = document.createElement('div');
    label.className = 'warmup-round-label';
    label.textContent = r;
    row.appendChild(label);
    WARMUP_STEPS.forEach((step) => {
      const done = rIsWarmupDone(r, step.id);
      const btn = document.createElement('button');
      btn.className = 'warmup-step' + (done ? ' done' : '');
      btn.innerHTML = `<span class="wlabel">${step.label}</span><span class="wdetail">${step.detail}</span>`;
      btn.addEventListener('click', () => rToggleWarmup(r, step.id));
      row.appendChild(btn);
    });
    wrap.appendChild(row);
    const restRow = document.createElement('div');
    restRow.className = 'rest-row';
    restRow.dataset.warmupRestRow = r;
    restRow.innerHTML = `<div class="bar-track" style="flex:1;"><div class="bar-fill" data-rest-fill style="width:100%"></div></div><div class="status" data-rest-time></div><button class="rest-skip" data-action="skip">Saltar</button>`;
    restRow.querySelector('[data-action="skip"]').addEventListener('click', rStopWarmupRest);
    wrap.appendChild(restRow);
    card.appendChild(wrap);
  }
  rRenderWarmupRestUI();
}
function rRenderWarmupRestUI() {
  document.querySelectorAll('[data-warmup-rest-row]').forEach((row) => row.classList.remove('active'));
  if (!rWarmupRestTimer) return;
  const row = document.querySelector(`[data-warmup-rest-row="${rWarmupRestTimer.round}"]`);
  if (!row) return;
  row.classList.add('active');
  row.querySelector('[data-rest-fill]').style.width = (rWarmupRestTimer.secondsLeft / REST_SECONDS * 100) + '%';
  row.querySelector('[data-rest-time]').textContent = rWarmupRestTimer.secondsLeft + 's';
}

function rRenderExercises() {
  const container = document.getElementById('exercisesCard');
  container.innerHTML = '';
  rGetExercises().forEach((ex) => {
    const done = rGetCompleted(ex);
    const finished = done === ex.sets;
    const card = document.createElement('div');
    card.className = 'ex-card' + (finished ? ' finished' : '');
    card.dataset.exId = ex.id;
    card.innerHTML = `
      <div class="ex-head">
        <div><div class="ex-name">${ex.name}</div><div class="ex-scheme">${ex.sets} × ${ex.reps}</div></div>
      </div>
      <div class="weight-row">
        <button class="stepper-btn" data-action="dec">−</button>
        <div class="weight-val">${rGetWeight(ex)} <span style="font-size:12px; color:var(--text-dim);">kg</span></div>
        <button class="stepper-btn" data-action="inc">+</button>
      </div>
      <div class="plate-row"></div>
      <div class="rest-row" data-rest-row>
        <div class="bar-track" style="flex:1;"><div class="bar-fill" data-rest-fill style="width:100%"></div></div>
        <div class="status" data-rest-time></div>
        <button class="rest-skip" data-action="skip">Saltar</button>
      </div>
    `;
    card.querySelector('[data-action="dec"]').addEventListener('click', () => rSetWeight(ex, rGetWeight(ex) - 2.5));
    card.querySelector('[data-action="inc"]').addEventListener('click', () => rSetWeight(ex, rGetWeight(ex) + 2.5));
    card.querySelector('[data-action="skip"]').addEventListener('click', rStopRest);
    const plateRow = card.querySelector('.plate-row');
    for (let i = 0; i < ex.sets; i++) {
      const btn = document.createElement('button');
      btn.className = 'plate' + (i < done ? ' filled' : '');
      btn.addEventListener('click', () => rTapPlate(ex, i));
      plateRow.appendChild(btn);
    }
    container.appendChild(card);
  });
  const finishBtn = document.getElementById('finishRutinaBtn');
  const hint = document.getElementById('finishHint');
  const progress = rAnyProgress();
  finishBtn.disabled = !progress;
  finishBtn.style.opacity = progress ? '1' : '.5';
  finishBtn.textContent = rAllDone() ? 'Finalizar sesión — todo completo' : 'Finalizar sesión';
  hint.style.display = (progress && !rAllDone()) ? 'block' : 'none';
  document.getElementById('rutinaExStatus').textContent = 'Rutina ' + rGetDay();
  rRenderRestUI();
}
function rRenderRestUI() {
  document.querySelectorAll('[data-rest-row]').forEach((row) => row.classList.remove('active'));
  if (!rRestTimer) return;
  const card = document.querySelector(`.ex-card[data-ex-id="${rRestTimer.exId}"]`);
  if (!card) return;
  const row = card.querySelector('[data-rest-row]');
  row.classList.add('active');
  row.querySelector('[data-rest-fill]').style.width = (rRestTimer.secondsLeft / REST_SECONDS * 100) + '%';
  row.querySelector('[data-rest-time]').textContent = rRestTimer.secondsLeft + 's';
}

function rRenderHistory() {
  const tbody = document.querySelector('#rutinaHistTable tbody');
  tbody.innerHTML = '';
  document.getElementById('rutinaHistCount').textContent = rState.history.length;
  rState.history.forEach((h, idx) => {
    const tr = document.createElement('tr');
    const detail = h.exercises.map(e => `${e.name} ${e.weight}kg ${e.setsDone}/${e.setsTarget}`).join(' · ');
    const dateCell = document.createElement('td');
    if (rEditingHistIndex === idx) {
      const input = document.createElement('input');
      input.type = 'datetime-local';
      input.value = toInputValue(h.date);
      input.style.cssText = "background:var(--bg); border:1px solid var(--border); border-radius:6px; color:var(--text); font-family:'IBM Plex Mono'; font-size:11px; padding:4px;";
      input.addEventListener('change', () => {
        rState.history[idx].date = fromInputValue(input.value);
        rEditingHistIndex = null; rSaveState(); rRenderHistory();
      });
      input.addEventListener('blur', () => { rEditingHistIndex = null; rRenderHistory(); });
      dateCell.appendChild(input);
      setTimeout(() => input.focus(), 0);
    } else {
      const btn = document.createElement('button');
      btn.className = 'hist-date-btn';
      btn.textContent = formatDateShort(h.date);
      btn.addEventListener('click', () => { rEditingHistIndex = idx; rRenderHistory(); });
      dateCell.appendChild(btn);
    }
    tr.appendChild(dateCell);
    const dayCell = document.createElement('td'); dayCell.textContent = h.day; tr.appendChild(dayCell);
    const detailCell = document.createElement('td'); detailCell.style.fontSize = '10px'; detailCell.textContent = detail; tr.appendChild(detailCell);
    tbody.appendChild(tr);
  });
}

function rRender() {
  const day = rGetDay();
  document.getElementById('rutinaDayTitle').textContent = 'RUTINA ' + day;
  document.getElementById('rutinaDaySub').textContent = `Sesión ${rState.sessionIndex + 1}`;
  document.getElementById('pickRutinaA').style.background = day === 'A' ? 'var(--accent)' : '';
  document.getElementById('pickRutinaA').style.color = day === 'A' ? '#04141C' : '';
  document.getElementById('pickRutinaB').style.background = day === 'B' ? 'var(--accent)' : '';
  document.getElementById('pickRutinaB').style.color = day === 'B' ? '#04141C' : '';
  const dateInput = document.getElementById('rutinaDateInput');
  if (document.activeElement !== dateInput) dateInput.value = toInputValue(rState.currentSessionDate);
  rRenderWarmup();
  rRenderExercises();
  rRenderHistory();
}

document.getElementById('pickRutinaA').addEventListener('click', () => rSetDay('A'));
document.getElementById('pickRutinaB').addEventListener('click', () => rSetDay('B'));
document.getElementById('finishRutinaBtn').addEventListener('click', rFinishSession);
document.getElementById('rutinaDateInput').addEventListener('change', (e) => {
  rState.currentSessionDate = fromInputValue(e.target.value);
  rSaveState();
});

rLoadState();
rRender();

// default dates to today
document.querySelectorAll('input[type=date]').forEach(inp=> inp.value = todayISO());

loadAll();
</script>
</body>
</html>
